name: Android Release

# Run tests and signed arm64 builds concurrently; publish only if both succeed.
# Skip documentation-only pushes. Pull requests run test checks only.
# Every release retains the original signing certificate and version scheme.
#
# Two channels, one build counter (this workflow's run number, which only
# orders installs - versionCode 2000 + n):
#   main -> a new version each push: 1.7.3, 1.7.4, ...  (the last release's
#           patch + 1; pubspec's version when it is higher, e.g. 1.8.0)
#           tag v<version>-build.<n>, marked latest
#   beta -> the version the next release will be, as a beta:
#           1.7.4-beta (build n), tag v<version>-build.<n>-beta, pre-release
# Both are the same app (same package and key), so a beta installs over the
# release before it and the next release installs over the beta. The app
# offers betas only with Settings > Include Beta Updates on.

on:
  push:
    branches: [main, beta]
    paths-ignore:
      - "**/*.md"
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.47.2"
  # The arm64 APK's versionCode is 2000 + build number. Builds made
  # before CI went up to 2016, so CI build numbers start above 16 and
  # every CI APK installs over the last one.
  BUILD_NUMBER_OFFSET: "16"
  # SHA-256 of the release signing certificate (public, not a secret).
  # A build signed with any other key is refused, so a missing or wrong
  # secret never publishes an APK that cannot install over the old one.
  EXPECTED_CERT_SHA256: "aa493047b750ce9d667245e1e37b125779c7750b0e05107a17ab00bbb46bd929"

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Analyze
        run: flutter analyze lib test

      - name: Test
        run: flutter test

  build:
    name: Build signed APK
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.version.outputs.name }}
      build: ${{ steps.version.outputs.build }}
      tag: ${{ steps.version.outputs.tag }}
      channel: ${{ steps.version.outputs.channel }}
      file: ${{ steps.apk.outputs.file }}
    steps:
      - uses: actions/checkout@v5
        with:
          # The release tags, to number the next version.
          fetch-depth: 0

      - name: Check signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=""
          for name in KEYSTORE_BASE64 KEY_ALIAS STORE_PASSWORD KEY_PASSWORD; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing (Settings > Secrets and variables > Actions)"
            exit 1
          fi

      - name: Version
        id: version
        run: |
          BASE=$(grep '^version:' pubspec.yaml | sed 's/^version: //' | cut -d'+' -f1 | cut -d'-' -f1)
          # The last release (betas aside) and the version after it; the
          # pubspec's version wins when it is higher (a minor or major bump).
          LAST=$(git tag -l 'v*-build.*' | grep -v -- '-beta$' | sed -E 's/^v([0-9.]+)-build\..*/\1/' | sort -V | tail -1)
          if [ -n "$LAST" ]; then
            NEXT="${LAST%.*}.$(( ${LAST##*.} + 1 ))"
          else
            NEXT=$BASE
          fi
          NAME=$(printf '%s\n%s\n' "$NEXT" "$BASE" | sort -V | tail -1)
          echo "Last release: ${LAST:-none}, pubspec: $BASE, this build: $NAME"
          BUILD=$(( ${{ github.run_number }} + BUILD_NUMBER_OFFSET ))
          if [ "$GITHUB_REF" = "refs/heads/beta" ]; then
            CHANNEL=beta
            SUFFIX=-beta
          else
            CHANNEL=release
            SUFFIX=
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "suffix=$SUFFIX" >> "$GITHUB_OUTPUT"
          echo "tag=v$NAME-build.$BUILD$SUFFIX" >> "$GITHUB_OUTPUT"
          # A beta names itself (1.7.2-beta), so the app knows its channel.
          sed -i "s/^version: .*/version: $NAME$SUFFIX+$BUILD/" pubspec.yaml
          echo "Building $NAME$SUFFIX+$BUILD ($CHANNEL)"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # Let Gradle cache dependencies and reusable task outputs across runs.
      # The old immutable ~2 GB cache was never updated after its first hit.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "keyAlias=$KEY_ALIAS"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - run: flutter pub get

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          started=$SECONDS
          flutter build apk --release --split-per-abi --target-platform android-arm64
          elapsed=$((SECONDS - started))
          echo "### Android release performance" >> "$GITHUB_STEP_SUMMARY"
          echo "- APK compilation: ${elapsed}s" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: ${GITHUB_SHA:0:7}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Channel: ${{ steps.version.outputs.channel }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify signature and version
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          ls -la "$APK"
          # The newest build-tools on the runner may need a newer Java than
          # the JDK 17 set up for Gradle; try versions newest first and
          # keep the first apksigner that runs.
          CERT=""
          for v in $(ls "$ANDROID_HOME/build-tools" | grep -E '^[0-9]+(\.[0-9]+)*$' | sort -rV); do
            TOOLS="$ANDROID_HOME/build-tools/$v"
            [ -x "$TOOLS/apksigner" ] || continue
            if OUTPUT=$("$TOOLS/apksigner" verify --print-certs "$APK" 2>&1); then
              echo "apksigner from build-tools $v:"
              printf '%s\n' "$OUTPUT" | grep -i 'digest' || true
              # "Signer #1 certificate ..." in older build-tools, other
              # signer labels in newer ones: take the first SHA-256 line.
              CERT=$(printf '%s\n' "$OUTPUT" \
                | awk -F'SHA-256 digest: ' '/certificate SHA-256 digest: /{print $2; exit}')
              break
            fi
            echo "apksigner $v failed:"
            printf '%s\n' "$OUTPUT" | tail -5
          done
          if [ "$CERT" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::APK signed with '${CERT}', expected $EXPECTED_CERT_SHA256. Check the KEYSTORE_BASE64 secret."
            exit 1
          fi
          "$TOOLS/aapt2" dump badging "$APK" | sed -n 1p
          OUT="LightLib-${{ steps.version.outputs.name }}-build.${{ steps.version.outputs.build }}${{ steps.version.outputs.suffix }}-arm64.apk"
          mv "$APK" "$OUT"
          sha256sum "$OUT" > "$OUT.sha256"
          echo "file=$OUT" >> "$GITHUB_OUTPUT"

      # Transfer the verified APK to the publish job only after tests pass.
      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: signed-android-arm64
          path: |
            LightLib-*-arm64.apk
            LightLib-*-arm64.apk.sha256
          if-no-files-found: error
          retention-days: 1

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" android/key.properties
  publish:
    name: Publish tested release
    needs: [test, build]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download verified APK
        uses: actions/download-artifact@v4
        with:
          name: signed-android-arm64
          path: .

      - name: Verify transferred checksum
        shell: bash
        run: sha256sum -c "${{ needs.build.outputs.file }}.sha256"

      - name: Release notes
        run: |
          # A release lists everything since the last release (betas
          # included); a beta, since the last build of either channel.
          if [ "${{ needs.build.outputs.channel }}" = "beta" ]; then
            PREV=$(git describe --tags --match 'v*-build.*' --abbrev=0 HEAD^ 2>/dev/null || true)
          else
            PREV=$(git describe --tags --match 'v*-build.*' --exclude '*-beta' --abbrev=0 HEAD^ 2>/dev/null || true)
          fi
          {
            if [ "${{ needs.build.outputs.channel }}" = "beta" ]; then
              echo "Beta: for testing before the next release. In the app: Settings > Include Beta Updates."
              echo
            fi
            echo "Commit: ${GITHUB_SHA:0:7}"
            echo
            if [ -n "$PREV" ]; then
              echo "Changes since $PREV:"
              git log --no-merges --format='- %s (%h)' "$PREV..HEAD"
            else
              git log --no-merges --format='- %s (%h)' -1
            fi
            echo
            echo "SHA-256: \`$(cut -d' ' -f1 "${{ needs.build.outputs.file }}.sha256")\`"
          } > notes.md
          cat notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ needs.build.outputs.channel }}" = "beta" ]; then
            TITLE="LightLib ${{ needs.build.outputs.name }} beta (build ${{ needs.build.outputs.build }})"
            MARK=--prerelease
          else
            TITLE="LightLib ${{ needs.build.outputs.name }}"
            MARK=--latest
          fi
          gh release create "${{ needs.build.outputs.tag }}" \
            "${{ needs.build.outputs.file }}" \
            "${{ needs.build.outputs.file }}.sha256" \
            --target "$GITHUB_SHA" \
            --title "$TITLE" \
            --notes-file notes.md \
            "$MARK"

