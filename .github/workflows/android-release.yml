name: Android Release

# Run tests and signed arm64 builds concurrently; publish only if both succeed.
# Skip documentation-only pushes. Pull requests run test checks only.
# Every release retains the original signing certificate and version scheme.

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.47.2"
  # The arm64 APK's versionCode is 2000 + build number. Builds made
  # before CI went up to 2016, so CI build numbers start above 16 and
  # every CI APK installs over the last one.
  BUILD_NUMBER_OFFSET: "16"
  # SHA-256 of the release signing certificate (public, not a secret).
  # A build signed with any other key is refused, so a missing or wrong
  # secret never publishes an APK that cannot install over the old one.
  EXPECTED_CERT_SHA256: "663ff5abb728a1bffe57b27170a5a00bdbc0c44c397e3e8f358b4b517efdccfc"

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Analyze
        run: flutter analyze lib test

      - name: Test
        run: flutter test

  build:
    name: Build signed APK
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.version.outputs.name }}
      build: ${{ steps.version.outputs.build }}
      tag: ${{ steps.version.outputs.tag }}
      file: ${{ steps.apk.outputs.file }}
    steps:
      - uses: actions/checkout@v5

      - name: Check signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=""
          for name in KEYSTORE_BASE64 KEY_ALIAS STORE_PASSWORD KEY_PASSWORD; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing (Settings > Secrets and variables > Actions)"
            exit 1
          fi

      - name: Version
        id: version
        run: |
          NAME=$(grep '^version:' pubspec.yaml | sed 's/^version: //' | cut -d'+' -f1)
          BUILD=$(( ${{ github.run_number }} + BUILD_NUMBER_OFFSET ))
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "tag=v$NAME-build.$BUILD" >> "$GITHUB_OUTPUT"
          sed -i "s/^version: .*/version: $NAME+$BUILD/" pubspec.yaml
          echo "Building $NAME+$BUILD"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # Let Gradle cache dependencies and reusable task outputs across runs.
      # The old immutable ~2 GB cache was never updated after its first hit.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "keyAlias=$KEY_ALIAS"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --split-per-abi --target-platform android-arm64

      - name: Verify signature and version
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          ls -la "$APK"
          # The newest build-tools on the runner may need a newer Java than
          # the JDK 17 set up for Gradle; try versions newest first and
          # keep the first apksigner that runs.
          CERT=""
          for v in $(ls "$ANDROID_HOME/build-tools" | grep -E '^[0-9]+(\.[0-9]+)*$' | sort -rV); do
            TOOLS="$ANDROID_HOME/build-tools/$v"
            [ -x "$TOOLS/apksigner" ] || continue
            if OUTPUT=$("$TOOLS/apksigner" verify --print-certs "$APK" 2>&1); then
              echo "apksigner from build-tools $v:"
              printf '%s\n' "$OUTPUT" | grep -i 'digest' || true
              # "Signer #1 certificate ..." in older build-tools, other
              # signer labels in newer ones: take the first SHA-256 line.
              CERT=$(printf '%s\n' "$OUTPUT" \
                | awk -F'SHA-256 digest: ' '/certificate SHA-256 digest: /{print $2; exit}')
              break
            fi
            echo "apksigner $v failed:"
            printf '%s\n' "$OUTPUT" | tail -5
          done
          if [ "$CERT" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::APK signed with '${CERT}', expected $EXPECTED_CERT_SHA256. Check the KEYSTORE_BASE64 secret."
            exit 1
          fi
          "$TOOLS/aapt2" dump badging "$APK" | sed -n 1p
          OUT="LightLib-${{ steps.version.outputs.name }}-build.${{ steps.version.outputs.build }}-arm64.apk"
          mv "$APK" "$OUT"
          sha256sum "$OUT" > "$OUT.sha256"
          echo "file=$OUT" >> "$GITHUB_OUTPUT"

      # Transfer the verified APK to the publish job only after tests pass.
      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: signed-android-arm64
          path: |
            LightLib-*-arm64.apk
            LightLib-*-arm64.apk.sha256
          if-no-files-found: error
          retention-days: 1

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" android/key.properties
  publish:
    name: Publish tested release
    needs: [test, build]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download verified APK
        uses: actions/download-artifact@v4
        with:
          name: signed-android-arm64
          path: .

      - name: Verify transferred checksum
        shell: bash
        run: sha256sum -c "${{ needs.build.outputs.file }}.sha256"

      - name: Release notes
        run: |
          PREV=$(git describe --tags --match 'v*-build.*' --abbrev=0 HEAD^ 2>/dev/null || true)
          {
            echo "Commit: ${GITHUB_SHA:0:7}"
            echo
            if [ -n "$PREV" ]; then
              echo "Changes since $PREV:"
              git log --no-merges --format='- %s (%h)' "$PREV..HEAD"
            else
              git log --no-merges --format='- %s (%h)' -1
            fi
            echo
            echo "SHA-256: \`$(cut -d' ' -f1 "${{ needs.build.outputs.file }}.sha256")\`"
          } > notes.md
          cat notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ needs.build.outputs.tag }}" \
            "${{ needs.build.outputs.file }}" \
            "${{ needs.build.outputs.file }}.sha256" \
            --target "$GITHUB_SHA" \
            --title "LightLib ${{ needs.build.outputs.name }} (build ${{ needs.build.outputs.build }})" \
            --notes-file notes.md \
            --latest

