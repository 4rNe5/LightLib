<!DOCTYPE html>
<html>
<head>
  <!-- Replaced by flutter build's --base-href. -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="LightLib - read your EPUBs and translate them with Gemini, in sync with the phone app.">
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">

  <!-- Home-screen app -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="LightLib">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">

  <title>LightLib</title>
  <link rel="manifest" href="manifest.json">

  <!-- The app's script starts coming with this page, and the hosts its
       drawing engine and fonts come from are reached ahead of time. -->
  <link rel="preload" href="main.dart.js" as="script">
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- What shows from the first moment until the app draws its first
       frame (splash.js takes it away then). -->
  <style>
    html, body { height: 100%; margin: 0; background: #fff; }
    #splash {
      position: fixed; inset: 0; z-index: 10; pointer-events: none;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: #fff; color: #111;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
      transition: opacity .22s ease;
    }
    #splash.gone { opacity: 0; }
    #splash .mark {
      width: 60px; height: 60px; border-radius: 18px; background: #FF6B9D;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 12px 30px rgba(255, 107, 157, .35);
    }
    #splash .name { margin-top: 18px; font-size: 22px; font-weight: 800; letter-spacing: -.2px; }
    #splash .bar {
      margin-top: 22px; width: 132px; height: 3px; border-radius: 2px; overflow: hidden;
      background: rgba(128, 128, 128, .22);
    }
    #splash .bar i {
      display: block; width: 40%; height: 100%; border-radius: 2px; background: #FF6B9D;
      animation: splash-run 1.15s ease-in-out infinite;
    }
    @keyframes splash-run { 0% { transform: translateX(-110%); } 100% { transform: translateX(270%); } }
    @media (prefers-color-scheme: dark) {
      html, body, #splash { background: #000; }
      #splash { color: #f4f4f4; }
    }
    @media (prefers-reduced-motion: reduce) { #splash .bar i { animation: none; width: 100%; opacity: .5; } }
  </style>
</head>
<body>
  <div id="splash" role="status" aria-label="LightLib">
    <div class="mark">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 6.5c-1.8-1.4-4.2-2-7-2v13c2.800 0 5.200.6 7 2 1.800-1.400 4.200-2 7-2v-13c-2.800 0-5.200.6-7 2z"/>
        <path d="M12 6.500v13"/>
      </svg>
    </div>
    <div class="name">LightLib</div>
    <div class="bar"><i></i></div>
  </div>
  <script src="splash.js"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
